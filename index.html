<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลาทำงาน</title>
    <!-- LIFF SDK URL ที่ถูกต้อง -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .card { background-color: white; width: 100%; max-width: 450px; min-height: 100vh; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; }
        .header { background-color: #11999e; color: white; text-align: center; padding: 30px 20px 60px 20px; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; }
        .header h2 { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .header p { font-size: 16px; opacity: 0.9; }
        .avatar-container { text-align: center; margin-top: -50px; margin-bottom: 25px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.15); object-fit: cover; background-color: #e0e0e0; }
        .content { padding: 0 25px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .time-box { border: 1px solid #40a798; background-color: #f6fbfb; color: #40a798; width: 100%; text-align: center; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 16px; }
        .time-box .time { font-size: 22px; font-weight: bold; margin-top: 5px; }
        .btn { width: 100%; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-in { background-color: #06C755; }
        .btn-out { background-color: #e43f5a; }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #cc0000; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>ลงเวลาทำงานโรงพยาบาลภูเพียง</h2>
            <p id="userName">🔄 กำลังโหลดข้อมูลผู้ใช้...</p>
        </div>

        <div class="avatar-container">
            <img id="userAvatar" class="avatar" src="https://ssl.gstatic.com/accounts/ui/avatar_2x.png" alt="Profile">
        </div>

        <div class="content">
            <div class="time-box">
                <div id="typeLabel">เวลาปัจจุบันของคุณคือ</div>
                <div id="currentTime" class="time">00/00/0000 00:00:00</div>
            </div>

            <button class="btn" id="mainButton" onclick="sendData()" disabled>🔄 กำลังตรวจสอบพิกัด...</button>
            <div id="status">กำลังตรวจจับระยะห่างจากที่ทำงาน...</div>
        </div>
    </div>

    <script>
        const MY_LIFF_ID = "2010980900-k8VaJicy"; 
        // ⚠️ ต้องใช้ Web App URL ที่สิทธิ์เป็น Anyone (ลงท้ายด้วย /exec)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhy0sMmZRdV-KMTsr7go4KQsnfRrHhvp46sa-iLJeN0ZxchKfRht-3IGG7bVFfpo_k/exec"; 
        
        // 📍 พิกัดที่ทำงานจริง
        const OFFICE_LAT = 18.747834249255696; 
        const OFFICE_LNG = 1100.79581193419803; 

        let userId = "UNKNOWN"; 
        let userName = "ไม่ระบุชื่อ"; 
        let clockType = "in";
        let savedPosition = null;
        
        // ตรวจสอบ Parameter การลงเวลาเข้า/ออก
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('type') === 'out') { clockType = "out"; }

        // นาฬิกา พ.ศ. เรียลไทม์
        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear() + 543;
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('currentTime').innerText = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) { 
                    liff.login(); 
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId; 
                    userName = profile.displayName;
                    document.getElementById('userName').innerText = userName;
                    if(profile.pictureUrl) {
                        document.getElementById('userAvatar').src = profile.pictureUrl;
                    }
                }
            } catch (error) { 
                console.error("LIFF Init Error:", error);
                document.getElementById('userName').innerText = "ผู้ใช้งานทั่วไป";
            } finally {
                checkLocationPermission();
            }
        }
        main();

        function checkLocationPermission() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(validateDistance, (err) => {
                    document.getElementById('status').style.color = "#cc0000";
                    document.getElementById('status').innerText = "กรุณาเปิด GPS และอนุญาตสิทธิ์เข้าถึงพิกัด";
                    document.getElementById('mainButton').innerText = "❌ ไม่พบพิกัด GPS";
                }, { enableHighAccuracy: true, timeout: 10000 });
            } else {
                document.getElementById('status').innerText = "อุปกรณ์ของคุณไม่รองรับ GPS";
            }
        }

        // คำนวณระยะทาง Haversine
        function validateDistance(position) {
            savedPosition = position;
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            const R = 6371000;
            const dLat = (lat - OFFICE_LAT) * Math.PI / 180;
            const dLng = (lng - OFFICE_LNG) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(OFFICE_LAT * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            const btn = document.getElementById('mainButton');
            if (distance <= 50) {
                btn.disabled = false;
                document.getElementById('status').style.color = "#06C755";
                document.getElementById('status').innerText = `คุณอยู่ในระยะทำงานแล้ว (ห่าง ${distance.toFixed(1)} ม.)`;
                if(clockType === "in") {
                    btn.innerText = "ลงเวลาเข้างาน"; 
                    btn.className = "btn btn-in";
                } else {
                    btn.innerText = "ลงเวลากลับ"; 
                    btn.className = "btn btn-out";
                }
            } else {
                btn.disabled = true;
                document.getElementById('status').style.color = "#cc0000";
                document.getElementById('status').innerText = `อยู่นอกพื้นที่! ห่าง ${distance.toFixed(1)} เมตร (จำกัดไม่เกิน 50 ม.)`;
                btn.innerText = "❌ บล็อก: อยู่นอกระยะทำงาน";
                btn.className = "btn";
            }
        }

       async function sendData() {
            if(!savedPosition) return;
            
            const btn = document.getElementById('mainButton');
            btn.disabled = true;
            document.getElementById('status').innerText = "กำลังบันทึกข้อมูลลง Google Sheets...";
            
            // คำนวณระยะทางล่าสุดอีกครั้งเพื่อส่งไปบันทึก
            const lat = savedPosition.coords.latitude;
            const lng = savedPosition.coords.longitude;
            const R = 6371000;
            const dLat = (lat - OFFICE_LAT) * Math.PI / 180;
            const dLng = (lng - OFFICE_LNG) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(OFFICE_LAT * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const calculatedDistance = R * c;

       
           const payload = { 
    type: clockType, 
    userId: userId, // ⚠️ ต้องมีบรรทัดนี้แนบไปด้วย
    userName: userName, 
    lat: lat, 
    lng: lng,
    distance: calculatedDistance,
    status: "เข้างานสำเร็จ"
};

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('status').style.color = "#06C755";
                document.getElementById('status').innerText = "บันทึกสำเร็จเรียบร้อย!";
                
                setTimeout(() => { 
                    if (typeof liff !== 'undefined' && liff.isInClient()) {
                        liff.closeWindow(); 
                    }
                }, 1500);
            } catch (error) { 
                console.error("Fetch error:", error);
                document.getElementById('status').style.color = "#cc0000";
                document.getElementById('status').innerText = "บันทึกข้อมูลล้มเหลว กรุณาลองใหม่"; 
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
