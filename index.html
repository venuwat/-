<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลาปฏิบัติงาน</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif, Tahoma;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 24px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 10px auto;
            border: 3px solid #06C755;
            object-fit: cover;
        }
        .user-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #444;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #06C755;
            color: white;
        }
        .btn-primary:hover {
            background-color: #05b04b;
        }
        .btn-danger {
            background-color: #de350b;
            color: white;
        }
        .btn-danger:hover {
            background-color: #bf2600;
        }
        .btn:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ลงเวลาปฏิบัติงาน</h2>
        
        <!-- รูปโปรไฟล์ LINE -->
        <img id="pictureUrl" class="profile-img hidden" src="" alt="Profile Picture">
        <p id="displayName" style="font-weight: bold; margin: 5px 0 15px 0;"></p>

        <!-- Loader สถาะเริ่มต้น -->
        <div id="loading" style="padding: 20px;">
            <p>กำลังโหลดข้อมูล...</p>
        </div>

        <!-- ฟอร์มสำหรับลงทะเบียน (แสดงเฉพาะผู้ที่ยังไม่ได้ลงทะเบียน) -->
        <div id="registrationForm" class="hidden">
            <h4 style="margin-bottom: 15px; color: #555;">ลงทะเบียนใช้งานระบบ</h4>
            <div class="input-group">
                <label>ชื่อจริง:</label>
                <input type="text" id="regFirstName" placeholder="กรอกชื่อจริง">
            </div>
            <div class="input-group">
                <label>นามสกุล:</label>
                <input type="text" id="regLastName" placeholder="กรอกนามสกุล">
            </div>
            <div class="input-group">
                <label>ตำแหน่ง (ถ้ามี):</label>
                <input type="text" id="regPosition" placeholder="กรอกตำแหน่ง">
            </div>
            <button id="btnRegister" class="btn btn-primary" onclick="submitRegistration()">ยืนยันการลงทะเบียน</button>
            <div id="regStatus" class="status-msg"></div>
        </div>

        <!-- หน้าจอลงเวลา (แสดงเฉพาะผู้ที่ลงทะเบียนแล้ว) -->
        <div id="clockSection" class="hidden">
            <div class="user-info">
                <div><strong>ชื่อ-สกุล:</strong> <span id="empFullName">-</span></div>
                <div><strong>ตำแหน่ง:</strong> <span id="empPosition">-</span></div>
                <div id="lastTimeBox" style="margin-top: 5px; color: #666; font-size: 13px;"></div>
            </div>

            <button id="btnClockIn" class="btn btn-primary" onclick="handleClock('in')">เข้างาน</button>
            <button id="btnClockOut" class="btn btn-danger" onclick="handleClock('out')">ออกงาน</button>
            <div id="clockStatus" class="status-msg"></div>
        </div>
    </div>

    <!-- Hidden Form & Hidden Iframe สำหรับส่งข้อมูลแบบ Cross-Domain โดยไม่เปลี่ยนหน้า -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="hiddenForm" action="" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="action" id="f_action">
        <input type="hidden" name="userId" id="f_userId">
        <input type="hidden" name="userName" id="f_userName">
        <input type="hidden" name="firstName" id="f_firstName">
        <input type="hidden" name="lastName" id="f_lastName">
        <input type="hidden" name="position" id="f_position">
        <input type="hidden" name="type" id="f_type">
        <input type="hidden" name="lat" id="f_lat">
        <input type="hidden" name="lng" id="f_lng">
        <input type="hidden" name="distance" id="f_distance">
    </form>

    <script>
        // *** กำหนดค่าคอนฟิก ***
        const LIFF_ID = "2010980900-k8VaJicy"; ; // ใส่ LIFF ID ของคุณ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBprjrFaUR-SmMDgtCEUJeMJDD6inHZvyQ9fkpZ6J4kexitUks14lFn7I4nwwLmgRZ/exec"; // ใส่ Web App URL ของ Google Apps Script

        let userId = '';
        let displayName = '';

        document.getElementById('hiddenForm').action = GOOGLE_SCRIPT_URL;

        // เริ่มต้นการทำงาน LIFF
        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    displayName = profile.displayName;

                    if (profile.pictureUrl) {
                        const img = document.getElementById('pictureUrl');
                        img.src = profile.pictureUrl;
                        img.classList.remove('hidden');
                    }
                    document.getElementById('displayName').innerText = displayName;

                    // ตรวจสอบสถานะการลงทะเบียนผ่าน JSONP
                    fetchUserDataJSONP(userId);
                }
            } catch (err) {
                console.error('LIFF Initialization failed', err);
                document.getElementById('loading').innerText = 'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาลองใหม่อีกครั้ง';
            }
        }

        // ดึงข้อมูลผู้ใช้จาก Google Sheet
        function fetchUserDataJSONP(uid) {
            window.handleUserDataResponse = function(data) {
                document.getElementById('loading').classList.add('hidden');
                
                if (data && data.registered) {
                    // ผู้ใช้ลงทะเบียนแล้ว
                    document.getElementById('empFullName').innerText = `${data.firstName} ${data.lastName}`;
                    document.getElementById('empPosition').innerText = data.position || '-';
                    
                    if (data.lastClockInTime) {
                        document.getElementById('lastTimeBox').innerText = `เวลาเข้างานล่าสุด: ${data.lastClockInTime}`;
                    }

                    document.getElementById('registrationForm').classList.add('hidden');
                    document.getElementById('clockSection').classList.remove('hidden');
                } else {
                    // ยังไม่ได้ลงทะเบียน
                    document.getElementById('registrationForm').classList.remove('hidden');
                    document.getElementById('clockSection').classList.add('hidden');
                }
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_SCRIPT_URL}?userId=${uid}&callback=handleUserDataResponse&t=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        // กดปุ่มลงทะเบียน
        function submitRegistration() {
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const position = document.getElementById('regPosition').value.trim();
            const statusBox = document.getElementById('regStatus');
            const btn = document.getElementById('btnRegister');

            if (!firstName || !lastName) {
                statusBox.style.color = "#cc0000";
                statusBox.innerText = "กรุณากรอกชื่อและนามสกุลให้ครบถ้วน";
                return;
            }

            btn.disabled = true;
            statusBox.style.color = "#007bff";
            statusBox.innerText = "กำลังบันทึกข้อมูลการลงทะเบียน...";

            document.getElementById('f_action').value = "register";
            document.getElementById('f_userId').value = userId;
            document.getElementById('f_firstName').value = firstName;
            document.getElementById('f_lastName').value = lastName;
            document.getElementById('f_position').value = position;

            document.getElementById('hiddenForm').submit();

            // หน่วงเวลา แล้วตรวจสอบผลพร้อม Retry
            setTimeout(() => {
                fetchUserDataJSONPCheck(userId, 1);
            }, 3500);
        }

        // ตรวจสอบผลหลังลงทะเบียน (พร้อมระบบ Retry หน่วงเวลารอ Apps Script ทำงานเสร็จ)
        function fetchUserDataJSONPCheck(uid, retryCount = 1) {
            const btn = document.getElementById('btnRegister');
            const statusBox = document.getElementById('regStatus');

            window.handleUserDataCheck = function(data) {
                if (data && data.registered) {
                    statusBox.style.color = "#06C755";
                    statusBox.innerText = "✅ ลงทะเบียนสำเร็จ!";
                    setTimeout(() => {
                        fetchUserDataJSONP(uid);
                    }, 1000);
                } else if (retryCount < 3) {
                    statusBox.innerText = `กำลังตรวจสอบข้อมูล... (${retryCount}/3)`;
                    setTimeout(() => {
                        fetchUserDataJSONPCheck(uid, retryCount + 1);
                    }, 2500);
                } else {
                    statusBox.style.color = "#cc0000";
                    statusBox.innerText = "ลงทะเบียนไม่ถูกต้อง ติดต่อเจ้าหน้าที่ดูแล (ไม่พบชื่อ-นามสกุลในระบบ)";
                    btn.disabled = false;
                }
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_SCRIPT_URL}?userId=${uid}&callback=handleUserDataCheck&t=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        // กดปุ่ม เข้างาน / ออกงาน
        function handleClock(type) {
            const statusBox = document.getElementById('clockStatus');
            const btnIn = document.getElementById('btnClockIn');
            const btnOut = document.getElementById('btnClockOut');

            btnIn.disabled = true;
            btnOut.disabled = true;
            statusBox.style.color = "#007bff";
            statusBox.innerText = "กำลังดึงพิกัดตำแหน่ง...";

            if (!navigator.geolocation) {
                statusBox.style.color = "#cc0000";
                statusBox.innerText = "อุปกรณ์ของคุณไม่รองรับการดึงพิกัด GPS";
                btnIn.disabled = false;
                btnOut.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    statusBox.innerText = "กำลังบันทึกเวลา...";

                    document.getElementById('f_action').value = "clock";
                    document.getElementById('f_userId').value = userId;
                    document.getElementById('f_userName').value = displayName;
                    document.getElementById('f_type').value = type;
                    document.getElementById('f_lat').value = lat;
                    document.getElementById('f_lng').value = lng;
                    document.getElementById('f_distance').value = "0"; // ปรับคำนวณระยะห่างเพิ่มเติมได้ที่นี่

                    document.getElementById('hiddenForm').submit();

                    setTimeout(() => {
                        statusBox.style.color = "#06C755";
                        statusBox.innerText = (type === 'in') ? "✅ บันทึกเวลาเข้างานเรียบร้อยแล้ว" : "✅ บันทึกเวลาออกงานเรียบร้อยแล้ว";
                        setTimeout(() => {
                            liff.closeWindow(); // ปิดหน้าต่าง LIFF หลังลงเวลาเสร็จ
                        }, 2000);
                    }, 2000);
                },
                (error) => {
                    statusBox.style.color = "#cc0000";
                    statusBox.innerText = "กรุณาเปิด GPS และอนุญาตให้เข้าถึงตำแหน่ง";
                    btnIn.disabled = false;
                    btnOut.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        main();
    </script>
</body>
</html>
